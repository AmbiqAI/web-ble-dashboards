<!DOCTYPE html>
<html>

<head>
  <title>NNSE over USB - Autodeploy</title>
  <link href='https://fonts.googleapis.com/css?family=Roboto Mono' rel='stylesheet'>
  <!-- <script src="https://cdn.jsdelivr.net/npm/flatbuffers@23.5.26/lib/flatbuffers.min.js"></script> -->


  <style>
     * {
      font-family: 'Roboto Mono', sans-serif;
    }

    body {
      color: white;
      background: #000000;
      font-size: 14px;
    }
    .container {
      width: 960px;
      margin: 30px auto;
    }

    #pairButton {
      background-color: #d8f41d;
      border: none;
      color: black;
      padding: 1px;
      text-align: center;
      text-decoration: none;

      margin: 8px 18px;
      height: 25px;
      width: 100px;
      border-radius: 10%;
      outline: none;

      border-radius: 20px;
      grid-column: 1;

      cursor: pointer;
    }

    .widget {
      background-color: #111111;
      border: 1px solid #000000;
      border-radius: 0px;
      padding: 12px;
      color: #DAE3E3;
      padding-bottom: 16px;
    }
    .doublegraph {
      width: 400px;
      height: 220px;
      vertical-align: bottom;
    }
    .double {
      width: 423px;
      height: 226px;
      vertical-align: bottom;
    }
    .spectrograph {
      height: "512";
      width: "700";
    }
    .status {
      margin-top: 1%;
      width: 885px;
      height: 42px;
      color: white;
      display: grid;
      grid-template-columns: 15% 70% 15%;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 10px;
    }

    #bluetooth {
      font-size: 16px;
      height: 50%;
      margin: auto;
    }

    .statusBar {
      height: 100%;
      grid-column: 2;
      vertical-align: middle;
      text-align: center;
    }

    .audioBar {
      height: 100%;
      grid-column: 1;
      vertical-align: middle;
      text-align: center;
    }

    #snackbar {
      height: 23px;
      display: block;
      visibility: visible;
      text-align: center;
      background-color: #374146;
      border-radius: 3px;
      padding: 4px 13px 4px 13px;
      margin: 16px auto 7px auto;
      width: fit-content;
      max-width: 885px;
    }

    #snackbar.show {
      -webkit-animation: fadein 0.5s, 0.1s;
      animation: fadein 0.5s, 0.1s;
    }


    @-webkit-keyframes fadein {
      from {
        visibility: hidden;
        opacity: 0;
      }
      to {
        visibility: visible;
        opacity: 1;
      }
    }

    @keyframes fadein {
      from {
        visibility: hidden;
        opacity: 0;
      }
      to {
        visibility: visible;
        opacity: 1;
      }
    }
    .label {
      height: 15px;
      display: inline;
      font-size: 12px;

    }

    /* Autodeploy specific styles */
    .autodeploy-section {
      width: 885px;
      margin: 10px auto;
      background-color: #111111;
      border: 1px solid #000000;
      border-radius: 0px;
      padding: 12px;
      color: #DAE3E3;
      padding-bottom: 16px;
    }

    .config-panel {
      /* All visual styles moved to autodeploy-section */
    }

    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
    }

    .config-label {
      font-size: 12px;
      color: #DAE3E3;
      min-width: 150px;
    }

    .config-input {
      background-color: #222;
      border: 1px solid #444;
      color: white;
      padding: 5px;
      border-radius: 3px;
      font-size: 12px;
      width: 120px;
    }

    .config-select {
      background-color: #222;
      border: 1px solid #444;
      color: white;
      padding: 5px;
      border-radius: 3px;
      font-size: 12px;
      width: 120px;
    }

    .action-button {
      background-color: #d8f41d;
      border: none;
      color: black;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      margin: 5px;
    }

    .action-button:disabled {
      background-color: #666;
      color: #999;
      cursor: not-allowed;
    }

    .progress-container {
      margin: 10px 0;
      display: none;
    }

    .progress-bar {
      background-color: #374146;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin: 5px 0;
    }

    .progress-fill {
      background-color: #d8f41d;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 11px;
    }

    .stats-table th,
    .stats-table td {
      border: 1px solid #333;
      padding: 5px;
      text-align: left;
    }

    .stats-table th {
      background-color: #222;
      color: #d8f41d;
    }

    .tab-container {
      display: flex;
      margin-bottom: 10px;
    }

    .tab {
      background-color: #222;
      border: 1px solid #444;
      color: white;
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 5px 5px 0 0;
      margin-right: 2px;
    }

    .tab.active {
      background-color: #111111;
      border-bottom: 1px solid #111111;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>

    // Get performance stats
    getStatsButton.addEventListener('click', getPerformanceStats);

    async function getPerformanceStats() {
        if (!port) {
            snack('Please connect to device first', 1);
            return;
        }

        try {
            console.log('=== Starting Performance Stats Request ===');
            console.log('Requesting performance stats...');
            
            // Get current configuration for debugging
            const modelLocation = parseInt(document.getElementById('modelLocation').value);
            const arenaLocation = parseInt(document.getElementById('arenaLocation').value);
            console.log('Current configuration:');
            console.log('  Model location:', modelLocation === 0 ? 'TCM' : 'SRAM');
            console.log('  Arena location:', arenaLocation === 0 ? 'TCM' : 'SRAM');
            
            // Show loading state
            getStatsButton.disabled = true;
            getStatsButton.textContent = 'Requesting...';
            
            // First get basic performance stats
            const stats = await port.requestStats();
            console.log('Performance stats received:', stats);
            displayPerformanceStats(stats);
            
            // Then collect PMU CSV data for model explorer
            console.log('Collecting PMU CSV data for model explorer...');
            try {
                const pmuData = await port.requestPmuCsv();
                console.log('PMU data collected and saved to localStorage:', pmuData);
                snack('Performance stats and PMU data collected', 0);
            } catch (pmuError) {
                console.warn('PMU data collection failed:', pmuError);
                snack('Performance stats received, but PMU data failed', 1);
            }
        } catch (error) {
            console.error('Failed to get stats:', error);
            snack('Failed to get stats: ' + error.message, 1);
        } finally {
            // Reset button state
            getStatsButton.disabled = false;
            getStatsButton.textContent = 'Get Performance Stats';
            console.log('=== Performance Stats Request Complete ===');
        }
    }

    function displayPerformanceStats(stats) {
        // Get current configuration for display
        const modelLocation = document.getElementById('modelLocation').value === '0' ? 'TCM' : 'SRAM';
        const arenaLocation = document.getElementById('arenaLocation').value === '0' ? 'TCM' : 'SRAM';
        
        // Display summary
        const summaryContent = document.getElementById('summaryContent');
        summaryContent.innerHTML = `
            <div><strong>Inference Cycles:</strong> ${stats.cycles.toLocaleString()}</div>
            <div><strong>Status:</strong> ${stats.status === 0 ? 'Success' : 'Error'}</div>
            <div><strong>Number of Layers:</strong> ${stats.num_layers || 'N/A'}</div>
            <div><strong>Arena Used:</strong> ${stats.arena_used ? stats.arena_used.toLocaleString() + ' bytes' : 'N/A'}</div>
            <div><strong>Model Location:</strong> ${modelLocation}</div>
            <div><strong>Arena Location:</strong> ${arenaLocation}</div>
        `;
        document.getElementById('statsSummary').style.display = 'block';

        // Display detailed table
        const tableBody = document.getElementById('statsTableBody');
        tableBody.innerHTML = '';

        // Add a single row for the inference result
        const row = tableBody.insertRow();
        row.insertCell(0).textContent = '1';
        row.insertCell(1).textContent = 'Model Inference';
        row.insertCell(2).textContent = stats.cycles.toLocaleString();
        row.insertCell(3).textContent = stats.status === 0 ? 'Success' : 'Error';
        row.insertCell(4).textContent = stats.num_layers || 'N/A';

        document.getElementById('statsTable').style.display = 'block';
        
        // Log to console for debugging
        console.log('Performance Stats Displayed:', {
            cycles: stats.cycles,
            status: stats.status,
            num_layers: stats.num_layers,
            arena_used: stats.arena_used,
            modelLocation: modelLocation,
            arenaLocation: arenaLocation
        });
    }

    // Convert PMU CSV data to multiple JSON files for Model Explorer
    function convertPmuCsvToMultipleJson(selectedAttributes) {
        console.log('Converting PMU CSV data to multiple JSON files for attributes:', selectedAttributes);
        
        // Get CSV content from localStorage
        const csvContent = localStorage.getItem('pmuCsvData');
        if (!csvContent) {
            console.error('No PMU CSV data found in localStorage');
            return null;
        }
        
        console.log('CSV content length:', csvContent.length);
        
        const lines = csvContent.trim().split('\n');
        console.log('Number of CSV lines:', lines.length);
        
        if (lines.length < 2) {
            console.error('CSV data is incomplete');
            return null;
        }
        
        const headers = lines[0].split(',').map(h => h.trim());
        console.log('CSV headers:', headers);
        
        const jsonFiles = [];
        
        // Create a JSON file for each selected attribute
        selectedAttributes.forEach(attribute => {
            console.log(`Creating JSON for attribute: ${attribute}`);
            
            // Find the column index for this attribute
            const columnIndex = headers.findIndex(h => h === attribute);
            if (columnIndex === -1) {
                console.warn(`Attribute ${attribute} not found in CSV headers`);
                return;
            }
            
            // Find min and max values for normalization (for color coding only)
            let minValue = Infinity;
            let maxValue = -Infinity;
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                const value = parseFloat(values[columnIndex]) || 0;
                minValue = Math.min(minValue, value);
                maxValue = Math.max(maxValue, value);
            }
            
            const valueRange = maxValue - minValue;
            
            // Create JSON structure for this attribute
            const jsonData = {
                "main": {
                    "results": {},
                    "thresholds": [
                        {
                            "value": minValue + (valueRange * 0.3),
                            "bgColor": "#44FF44",
                            "textColor": "#000000"
                        },
                        {
                            "value": minValue + (valueRange * 0.6),
                            "bgColor": "#FFCC00",
                            "textColor": "#000000"
                        },
                        {
                            "value": minValue + (valueRange * 0.9),
                            "bgColor": "#FF4444",
                            "textColor": "#FFFFFF"
                        }
                    ],
                    "gradient": [
                        {
                            "stop": minValue,
                            "bgColor": "#44FF44"
                        },
                        {
                            "stop": minValue + (valueRange * 0.5),
                            "bgColor": "#FFCC00"
                        },
                        {
                            "stop": maxValue,
                            "bgColor": "#FF4444"
                        }
                    ]
                }
            };
            
            // Process each data row (skip header)
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                const eventNumber = (i - 1).toString(); // Event number starts from 0
                const rawValue = parseFloat(values[columnIndex]) || 0;
                
                // Use normalized value only for color determination
                const normalizedValue = valueRange > 0 ? (rawValue - minValue) / valueRange : 0;
                
                console.log(`Event ${eventNumber}: ${attribute}=${rawValue}, normalized=${normalizedValue}`);
                
                // Determine colors based on normalized value
                let bgColor, textColor;
                if (normalizedValue < 0.3) {
                    bgColor = "#44FF44"; // Green for low values
                    textColor = "#000000";
                } else if (normalizedValue < 0.6) {
                    bgColor = "#FFCC00"; // Yellow for medium values
                    textColor = "#000000";
                } else {
                    bgColor = "#FF4444"; // Red for high values
                    textColor = "#FFFFFF";
                }
                
                // Add node data to results with ORIGINAL raw value
                jsonData.main.results[eventNumber] = {
                    value: rawValue, // Use original value, not normalized
                    bgColor: bgColor,
                    textColor: textColor
                };
            }
            
            // Create filename based on attribute name
            const filename = `${attribute.toLowerCase().replace(/[^a-z0-9]/g, '_')}.json`;
            
            jsonFiles.push({
                filename: filename,
                data: jsonData,
                attribute: attribute,
                minValue: minValue,
                maxValue: maxValue
            });
            
            console.log(`Created JSON for ${attribute}: ${Object.keys(jsonData.main.results).length} results`);
        });
        
        console.log(`Created ${jsonFiles.length} JSON files`);
        return jsonFiles;
    }

    async function old_usbConnect() {
        pairButton.style.backgroundColor = "grey";
        pairButton.style.color = 'black';
        pairButton.innerHTML = "CONNECTING";
        msg('requesting device ...');

        function connect() {
            port.connect().then(
                () => {
                    port.onReceive = data => {
                        // Log ALL received data for debugging
                        console.log('=== USB DATA RECEIVED ===');
                        console.log('Data length:', data.byteLength);
                        if (data && data.byteLength > 0) {
                            const dataArray = new Uint8Array(data.buffer);
                            console.log('Raw data:', Array.from(dataArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' '));
                            console.log('As string:', new TextDecoder().decode(dataArray));
                            
                            // Check if this is an ACK response (2 bytes: 0xAA, chunk_id)
                            if (data.byteLength === 2 && dataArray[0] === 0xAA) {
                                console.log('Received ACK for chunk:', dataArray[1]);
                                // Handle ACK - this will be processed by waitForAck
                                return; // Don't log further
                            }
                            
                            // Check for heartbeat or response messages
                            if (data.byteLength === 5) {
                                const message = new TextDecoder().decode(dataArray);
                                if (message === 'HELLO') {
                                    console.log('Received HELLO heartbeat from firmware');
                                    snack('Firmware heartbeat received!', 0);
                                    return;
                                } else if (message === 'RECV') {
                                    console.log('Received RECV response from firmware');
                                    snack('Firmware received packet!', 0);
                                    return;
                                }
                            }
                            
                            // Filter out audio data (83 bytes) and status data (7 bytes)
                            if (data.byteLength === 83 || data.byteLength === 7) {
                                console.log('Filtered out audio/status data');
                                return;
                            }
                            
                            // Only log unexpected data during upload debugging
                            console.log('Received unexpected data:', data.byteLength, 'bytes:', Array.from(dataArray.slice(0, Math.min(10, dataArray.length))).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' '));
                        }
                        console.log('=== END USB DATA ===');
                    };
                    port.onReceiveError = error => {
                        console.log("Error1: " + error);
                        console.error(error);
                    };
                },
                error => {
                    console.log("Error2: " + error);
                    msg(error);
                });
         }   

        serial.requestPort()
            .then(selectedPort => {
                port = selectedPort;
                connect();
            })
            .catch(error => {
                console.log("Error3: " + error);
                msg(error);
            });

        pairButton.style.backgroundColor = 'green';
        pairButton.style.color = 'white';
        pairButton.innerHTML = "CONNECTED";
        msg('Connected');
    }

    function onDisconnected(event) {
        let device = event.target;
        pairButton.style.backgroundColor = "red";
        pairButton.innerHTML = "PAIR";
        snack("Device disconnected, please retry", 1)
        snack('Device ' + device.name + ' has been disconnected.', 1);
        msg("Disconnected");
}

  // Top middle information label
  function msg(m) {
    BLEstatus.innerHTML = m;
  }

  //Top left pop up messaage
  function snack(m, warningLevel) {
    snackBar = document.getElementById("snackbar");
    snackBar.style.visibility = "visible";
    snackBar.className = "show";

    var warnEmoji = warningLevel ? '☝️  ' : '✅  ';

    setTimeout(function () { snackBar.className = snackBar.className.replace("show", ""); }, 501);
    snackBar.innerHTML = m + ' <span onClick=hideSnack() style="cursor:pointer; margin-left: 15px"> X </span> ';
  }

  function hideSnack() {
    snackBar = document.getElementById("snackbar");
    snackBar.style.visibility = "hidden";
  }

// Model Explorer Button
modelExplorerButton.addEventListener('click', async () => {
  if (!currentModelData) {
    snack('Please upload a model first', 1);
    return;
  }

  // Read the model as an ArrayBuffer
  const modelBuffer = await currentModelData.arrayBuffer();
  const blob = new Blob([modelBuffer], { type: 'application/octet-stream' });
  const blobUrl = URL.createObjectURL(blob);

  // Open new window with URL-encoded blob reference
  const explorerUrl = `model-explorer.html?modelUrl=${encodeURIComponent(blobUrl)}&filename=${encodeURIComponent(currentModelData.name)}`;
  window.open(explorerUrl, '_blank');
});

// Export JSON stats
refreshStatsButton.addEventListener('click', async () => {
        if (!port) {
            snack('Device not connected', 1);
            return;
        }
        try {
            console.log('Converting existing PMU CSV data to JSON...');
            
            // Show loading state
            refreshStatsButton.disabled = true;
            refreshStatsButton.textContent = 'Converting...';
            
            // Get selected attributes
            const selectedAttributes = getSelectedPmuAttributes();
            if (selectedAttributes.length === 0) {
                snack('Please select at least one PMU attribute to export', 1);
                return;
            }
            
            // Convert existing CSV data to JSON format for each selected attribute
            const jsonFiles = convertPmuCsvToMultipleJson(selectedAttributes);
            
            if (!jsonFiles || jsonFiles.length === 0) {
                snack('No PMU data available. Click "Get Performance Stats" first to collect data.', 1);
                return;
            }
            
            // Download each JSON file
            for (const jsonFile of jsonFiles) {
                const blob = new Blob([JSON.stringify(jsonFile.data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = jsonFile.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            snack(`Exported ${jsonFiles.length} JSON files successfully`, 0);
        } catch (error) {
            console.error('Failed to export JSON stats:', error);
            snack('Failed to export JSON stats: ' + error.message, 1);
        } finally {
            // Reset button state
            refreshStatsButton.disabled = false;
            refreshStatsButton.textContent = 'Export JSON Stats';
            console.log('=== JSON Stats Export Complete ===');
        }
    });

    // Initialize PMU attributes dropdown when page loads
    document.addEventListener('DOMContentLoaded', function() {
        populatePmuAttributes();
    });

</script>
