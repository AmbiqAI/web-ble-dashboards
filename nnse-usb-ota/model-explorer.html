<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Model Explorer Visualizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Import the package to register the custom element -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/ai-edge-model-explorer-visualizer@latest/dist/main_browser.min.js"></script> -->
  <script src="https://unpkg.com/ai-edge-model-explorer-visualizer@latest"></script>

  <style>
    body, html {
      height: 100%;
      overflow: hidden;
      padding: 0;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #4285f4;
      color: white;
      padding: 10px 20px;
      text-align: center;
      z-index: 1000;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
    }
    .content {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-size: 16px;
    }
    .error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #d32f2f;
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Model Explorer Visualizer</h1>
  </div>
  
  <div class="content" id="content">
    <div class="loading">
      <div>
        <h3>Loading Model Explorer...</h3>
        <p>Please wait while we prepare the visualizer.</p>
      </div>
    </div>
  </div>

  <script type="module" src="./parse-and-launch.js"></script>
