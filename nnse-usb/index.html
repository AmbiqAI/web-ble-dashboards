<!DOCTYPE html>
<html>
<head>
  <title>NNSE | Pro Studio Master</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root { --bg: #0a0a0b; --w: #141417; --neon: #d8f41d; --red: #FF355E; --text: #DAE3E3; --blue: #3498db; }
    * { box-sizing: border-box; font-family: 'Roboto Mono', monospace; }
    body { color: var(--text); background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
    
    .dashboard, .offline-container { width: 1000px; display: grid; grid-template-columns: 1fr 1fr; grid-gap: 15px; }
    
    .section-title { grid-column: 1 / -1; color: var(--neon); font-size: 14px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #2a2a2e; padding-bottom: 10px; margin-bottom: 5px; }
    .header-bar { grid-column: 1 / -1; background: var(--w); border: 1px solid #2a2a2e; padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; }
    #pairButton { background: var(--neon); border: none; color: #000; font-weight: bold; padding: 8px 24px; border-radius: 4px; cursor: pointer; }
    
    .widget { background: var(--w); border: 1px solid #2a2a2e; padding: 20px; border-radius: 4px; display: flex; flex-direction: column; }
    .widget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .widget-title { font-size: 11px; text-transform: uppercase; color: #666; border-left: 3px solid var(--neon); padding-left: 10px; }
    .select-opt { background: #000; color: #888; border: 1px solid #333; font-size: 10px; padding: 2px 5px; border-radius: 2px; cursor: pointer; }

    .vis-container { display: grid; grid-template-columns: 1fr 40px; grid-template-rows: 100px 100px; gap: 4px; background: #000; padding: 4px; border: 1px solid #333; }
    #waveformCanvas { grid-column: 1 / 2; grid-row: 1 / 2; width: 100%; height: 100%; background: #000; }
    #spectrogramCanvas { grid-column: 1 / 2; grid-row: 2 / 3; width: 100%; height: 100%; background: #000; image-rendering: pixelated; }
    #legendCanvas { grid-column: 2 / 3; grid-row: 2 / 3; width: 100%; height: 100%; background: #000; }

    .perf-metrics { margin-top: 10px; padding: 10px; background: #000; font-size: 10px; color: #555; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .perf-val { color: var(--neon); font-weight: bold; }
    .controls-row { display: flex; gap: 10px; margin-top: 10px; }
    .export-btn { flex: 2; background: var(--neon); color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 4px; }
    .recording { background: var(--red) !important; color: #fff !important; }
    #replayBtn { flex: 1; background: #333; color: var(--neon); border: 1px solid var(--neon); padding: 12px; border-radius: 4px; display: none; cursor: pointer; }

    .offline-container { grid-template-columns: 1fr; background: var(--w); border: 1px solid #2a2a2e; padding: 25px; border-radius: 4px; }
    .offline-box { background: #000; margin: 10px 0; padding: 15px; border-radius: 8px; border: 2px solid transparent; position: relative; opacity: 0.5; transition: 0.3s; }
    .offline-box.active { opacity: 1; border-color: var(--blue); }
    .label-tag { position: absolute; top: 5px; left: 10px; font-size: 10px; color: #888; text-transform: uppercase; z-index: 5; }
    .btn-group { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .mode-btn { padding: 15px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: #333; color: #fff; flex: 1; font-size: 14px; transition: 0.2s; }
    .mode-btn.active-enh { background: #00d28a; color: #000; box-shadow: 0 0 15px rgba(0, 210, 138, 0.3); }
    .mode-btn.active-noisy { background: #ff4d4d; color: #000; box-shadow: 0 0 15px rgba(255, 77, 77, 0.3); }
    #sampleSelect { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #333; margin-bottom: 10px; border-radius: 4px; }

    .audio-container { grid-column: 1 / -1; background: #1a1a1e; padding: 10px; border-radius: 4px; }
    audio { width: 100%; filter: invert(100%); }
  </style>
</head>
<body>

    <div class="dashboard">
        <div class="section-title">Live Production Monitor</div>
        <header class="header-bar">
            <div style="color: var(--neon); font-weight: bold;">NNSE v2.0</div>
            <div id="status">DISCONNECTED</div>
            <button id="pairButton">CONNECT DEVICE</button>
        </header>

        <div class="widget">
            <div class="widget-header">
                <span class="widget-title">Live Monitor (6s | 8kHz)</span>
                <select id="fftSelect" class="select-opt">
                    <option value="512">FFT: 512 (Fast)</option>
                    <option value="1024">FFT: 1024 (Detail)</option>
                </select>
            </div>
            
            <input type="range" id="gainSlider" min="-40" max="20" step="1" value="0" style="width:100%; accent-color:var(--neon);">
            <div style="font-size: 10px; margin: 5px 0;">GAIN: <span id="gainVal">0</span> dB</div>
            
            <div class="vis-container">
                <canvas id="waveformCanvas" width="300" height="100"></canvas>
                <canvas id="spectrogramCanvas" width="300" height="100"></canvas>
                <canvas id="legendCanvas" width="40" height="100"></canvas>
            </div>
            
            <div class="perf-metrics">
                <div>Draw: <span id="drawTime" class="perf-val">0</span>ms</div>
                <div>Spec: <span id="specTime" class="perf-val">0</span>ms</div>
            </div>

            <div class="controls-row">
                <button id="recordBtn" class="export-btn">Start Recording</button>
                <button id="replayBtn">Replay Take</button>
            </div>
        </div>

        <div class="widget">
            <span class="widget-title">Engine Metrics</span>
            <div id="SeLatency" style="width:100%; height:250px;"></div>
        </div>

        <div class="audio-container"><audio controls id="monitor"></audio></div>
    </div>

    <div class="offline-container">
        <div class="section-title">Offline Sample Comparison</div>
        <div style="padding: 0 10px;">
            <select id="sampleSelect">
                <option>Scanning /samples/ folder...</option>
            </select>

            <div id="panel0" class="offline-box active">
                <span class="label-tag">Channel 1: Enhanced</span>
                <div id="wave-enhanced"></div>
            </div>

            <div id="panel1" class="offline-box">
                <span class="label-tag">Channel 2: Noisy</span>
                <div id="wave-noisy"></div>
            </div>

            <div class="btn-group">
                <button id="btn0" class="mode-btn">LISTEN ENHANCED</button>
                <button id="btn1" class="mode-btn">LISTEN NOISY</button>
            </div>
        </div>
    </div>

    <audio id="playbackElement" style="display:none"></audio>

    <script src="serial.js"></script>
    <script>
        const audioWorker = new Worker('worker.js');
        const SAMPLE_RATE = 48000;
        const TOTAL_SAMPLES = SAMPLE_RATE * 6; 
        
        let chunkNum = 0, currentGain = 1, isRecording = false;
        let ringBuffer = new Float32Array(TOTAL_SAMPLES), writePtr = 0;
        let latestPieData = { inference: 0, encoder: 0, seEnabled: 0 };
        let spectroQueue = [];
        let lastWavUrl = null;

        let CURRENT_FFT_SIZE = 512;
        const DISPLAY_FREQ_MAX = 8000; 
        let windowTable, bitReverse, sinTable, cosTable, fftReal, fftImag;

        function setupFFT(size) {
            CURRENT_FFT_SIZE = size;
            windowTable = new Float32Array(size); bitReverse = new Uint16Array(size);
            sinTable = new Float32Array(size); cosTable = new Float32Array(size);
            fftReal = new Float32Array(size); fftImag = new Float32Array(size);
            for(let i=0; i<size; i++) {
                windowTable[i] = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (size - 1));
                sinTable[i] = Math.sin(-2 * Math.PI * i / size); cosTable[i] = Math.cos(-2 * Math.PI * i / size);
                let m = Math.log2(size), n = i, r = 0;
                for(let j=0; j<m; j++) { r = (r << 1) | (n & 1); n >>= 1; }
                bitReverse[i] = r;
            }
        }
        setupFFT(512);

        const specCanvas = document.getElementById('spectrogramCanvas');
        const specCtx = specCanvas.getContext('2d', { willReadFrequently: true });
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = specCanvas.width; tempCanvas.height = specCanvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        const colorMap = new Uint8ClampedArray(256 * 4);

        function createGradient() {
            const stops = [{ pos: 0.00, hex: "#000004" }, { pos: 0.16, hex: "#160b39" }, { pos: 0.33, hex: "#420a68" }, { pos: 0.50, hex: "#932667" }, { pos: 0.67, hex: "#dd513a" }, { pos: 0.84, hex: "#fca50a" }, { pos: 1.00, hex: "#fcffa4" }];
            const hexToRgb = (hex) => [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
            stops.forEach(s => s.rgb = hexToRgb(s.hex));
            for (let i = 0; i < 256; i++) {
                let t = i / 255;
                let s1 = stops[0], s2 = stops[stops.length - 1];
                for (let j = 0; j < stops.length - 1; j++) { if (t >= stops[j].pos && t <= stops[j+1].pos) { s1 = stops[j]; s2 = stops[j+1]; break; } }
                const localT = (t - s1.pos) / (s2.pos - s1.pos);
                for(let c=0; c<3; c++) colorMap[i*4+c] = Math.floor(s1.rgb[c] + (s2.rgb[c] - s1.rgb[c]) * localT);
                colorMap[i*4+3] = 255;
            }
            const lCtx = document.getElementById('legendCanvas').getContext('2d');
            for (let y = 0; y < 100; y++) {
                let idx = Math.floor((1 - (y / 100)) * 255);
                lCtx.fillStyle = `rgb(${colorMap[idx*4]},${colorMap[idx*4+1]},${colorMap[idx*4+2]})`;
                lCtx.fillRect(0, y, 15, 1);
            }
        }
        createGradient();

        function computeFFT(input) {
            const size = CURRENT_FFT_SIZE;
            for(let i=0; i<size; i++) { let rIdx = bitReverse[i]; fftReal[i] = (input[rIdx] || 0) * windowTable[rIdx]; fftImag[i] = 0; }
            for (let s = 2; s <= size; s *= 2) {
                let half = s / 2, step = size / s;
                for (let i = 0; i < size; i += s) {
                    for (let j = 0; j < half; j++) {
                        let k = j * step;
                        let tR = fftReal[i+j+half]*cosTable[k] - fftImag[i+j+half]*sinTable[k];
                        let tI = fftReal[i+j+half]*sinTable[k] + fftImag[i+j+half]*cosTable[k];
                        fftReal[i+j+half] = fftReal[i+j] - tR; fftImag[i+j+half] = fftImag[i+j] - tI;
                        fftReal[i+j] += tR; fftImag[i+j] += tI;
                    }
                }
            }
            const mags = new Float32Array(size / 2);
            for(let i=0; i<size/2; i++) mags[i] = Math.sqrt(fftReal[i]**2 + fftImag[i]**2);
            return mags;
        }

        const audioDecoder = new AudioDecoder({output: handleAudio, error: console.error});
        audioDecoder.configure({ codec: "opus", sampleRate: SAMPLE_RATE, numberOfChannels: 1 });
        const generator = new MediaStreamTrackGenerator({ kind: 'audio' });
        const audioWriter = generator.writable.getWriter();
        document.getElementById('monitor').srcObject = new MediaStream([generator]);

        function renderLoop() {
            const dStart = performance.now();
            let processed = 0;
            while (spectroQueue.length > 0 && processed < 10) { updateSpectrogram(spectroQueue.shift()); processed++; }
            drawWaveform();
            document.getElementById('drawTime').innerText = (performance.now() - dStart).toFixed(2);
            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        async function handleAudio(audioData) {
            const ab = new Float32Array(960); audioData.copyTo(ab, {planeIndex: 0});
            for (let i = 0; i < ab.length; i++) ab[i] *= currentGain;
            audioWorker.postMessage({ type: 'PROCESS_CHUNK', payload: ab });
            audioWriter.write(audioData).catch(()=>{});
            for (let i = 0; i < ab.length; i++) ringBuffer[(writePtr + i) % TOTAL_SAMPLES] = ab[i];
            writePtr = (writePtr + ab.length) % TOTAL_SAMPLES;
            spectroQueue.push(new Float32Array(ab));
        }

        function drawWaveform() {
            const canvas = document.getElementById('waveformCanvas'); const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.strokeStyle = '#FF355E';
            const step = Math.floor(TOTAL_SAMPLES / 300); const halfH = canvas.height / 2;
            for (let x = 0; x < 300; x++) {
                let start = (writePtr + (x * step)) % TOTAL_SAMPLES;
                let min = 1, max = -1;
                for (let i = 0; i < step; i+=16) { let s = ringBuffer[(start + i) % TOTAL_SAMPLES]; if (s < min) min = s; if (s > max) max = s; }
                ctx.moveTo(x, halfH + min * halfH); ctx.lineTo(x, halfH + max * halfH);
            }
            ctx.stroke();
        }

        function updateSpectrogram(chunk) {
            tempCtx.drawImage(specCanvas, 0, 0); specCtx.drawImage(tempCanvas, -1, 0);
            const mags = computeFFT(chunk); const h = specCanvas.height;
            const bins = Math.floor(DISPLAY_FREQ_MAX * CURRENT_FFT_SIZE / SAMPLE_RATE);
            const imgData = specCtx.createImageData(1, h);
            for (let y = 0; y < h; y++) {
                const bIdx = Math.floor((1 - (y / h)) * bins);
                let db = 20 * Math.log10(mags[bIdx] + 1e-6);
                let norm = Math.max(0, Math.min(1, (db + 80) / 90));
                const cIdx = Math.floor(norm * 255);
                imgData.data[y*4] = colorMap[cIdx*4]; imgData.data[y*4+1] = colorMap[cIdx*4+1];
                imgData.data[y*4+2] = colorMap[cIdx*4+2]; imgData.data[y*4+3] = 255;
            }
            specCtx.putImageData(imgData, specCanvas.width - 1, 0);
        }

        document.getElementById('pairButton').onclick = () => {
            serial.requestPort().then(p => p.connect().then(() => {
                p.onReceive = d => {
                    let type = d.getUint8(0);
                    if (type == 0x4) audioDecoder.decode(new EncodedAudioChunk({type: "key", data: new DataView(d.buffer, d.byteOffset+3, d.getUint8(1)), timestamp: chunkNum++ * 20000, duration: 20000}));
                    else if (type == 0x1) latestPieData.seEnabled = d.getUint8(3);
                    else if (type == 0x2) latestPieData.inference = d.getUint32(3, true);
                    else if (type == 0x3) latestPieData.encoder = d.getUint32(3, true) / 1000;
                };
                document.getElementById('status').innerText = "CONNECTED";
                document.getElementById('pairButton').innerText = "LIVE";
                document.getElementById('pairButton').style.background = "#FF355E";
            }));
        };

        setInterval(() => {
            if (document.getElementById('status').innerText !== "CONNECTED") return;
            let ai = (latestPieData.seEnabled == 0 ? 0 : latestPieData.inference / 10);
            let enc = latestPieData.encoder * 50;
            Plotly.react('SeLatency', [{ labels: ['AI', 'Enc', 'Idle'], values: [ai, enc, 1000-ai-enc], type: 'pie', marker: { colors: ['#00ff00', '#ffff00', '#0000ff'] } }], { plot_bgcolor: '#111', paper_bgcolor: '#111', margin: {l:10,r:10,b:10,t:10}, font: {color:'#888', size:10} });
        }, 250);

        document.getElementById('recordBtn').onclick = () => {
            if (!isRecording) { audioWorker.postMessage({ type: 'START_RECORDING' }); isRecording = true; recordBtn.innerText = "Stop Recording"; recordBtn.classList.add('recording'); }
            else { audioWorker.postMessage({ type: 'GENERATE_WAV' }); isRecording = false; recordBtn.innerText = "Start Recording"; recordBtn.classList.remove('recording'); }
        };

        audioWorker.onmessage = (e) => {
            if (e.data.type === 'WAV_BLOB') {
                lastWavUrl = URL.createObjectURL(e.data.blob);
                document.getElementById('replayBtn').style.display = 'block';
                document.getElementById('playbackElement').src = lastWavUrl;
            }
        };

        document.getElementById('replayBtn').onclick = () => { playbackElement.currentTime = 0; playbackElement.play(); };
        document.getElementById('gainSlider').oninput = (e) => { currentGain = Math.pow(10, e.target.value / 20); gainVal.innerText = e.target.value; };
    </script>

    <script type="module">
        import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js'

        const SAMPLES_DIR = '/nnse-usb/samples/'; 
        const select = document.getElementById('sampleSelect');
        let currentOffChannel = 0;

        const wsEnh = WaveSurfer.create({ container: '#wave-enhanced', waveColor: '#00d28a', progressColor: '#008f5d', height: 100 });
        const wsNoisy = WaveSurfer.create({ container: '#wave-noisy', waveColor: '#ff4d4d', progressColor: '#b33636', height: 100 });

        async function scanFolder() {
            try {
                const response = await fetch(SAMPLES_DIR);
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));
                select.innerHTML = '<option value="" disabled selected>-- Select Sample --</option>';
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href.toLowerCase().endsWith('.wav')) {
                        const opt = document.createElement('option');
                        opt.value = href; opt.textContent = decodeURIComponent(href).split('/').pop();
                        select.appendChild(opt);
                    }
                });
            } catch (e) { select.innerHTML = '<option>Run server in samples folder</option>'; }
        }

        select.onchange = async () => {
            const response = await fetch(SAMPLES_DIR + select.value);
            const arrayBuffer = await response.arrayBuffer();
            const audioCtx = new AudioContext();
            const fullBuf = await audioCtx.decodeAudioData(arrayBuffer);
            const b0 = bufferToWavBlob(fullBuf.getChannelData(0), fullBuf.sampleRate);
            const b1 = bufferToWavBlob(fullBuf.getChannelData(1), fullBuf.sampleRate);
            await Promise.all([wsEnh.loadBlob(b0), wsNoisy.loadBlob(b1)]);
            // Reset UI state when new sample loads
            document.getElementById('btn0').classList.remove('active-enh');
            document.getElementById('btn1').classList.remove('active-noisy');
        };

        window.togglePlayer = async (idx) => {
            // Get current timestamp from whoever was playing (or just starting at 0)
            const time = currentOffChannel === 0 ? wsEnh.getCurrentTime() : wsNoisy.getCurrentTime();
            
            // Stop both
            wsEnh.pause(); 
            wsNoisy.pause();
            
            currentOffChannel = idx;
            
            // Update UI Styles
            document.getElementById('panel0').classList.toggle('active', idx === 0);
            document.getElementById('panel1').classList.toggle('active', idx === 1);
            document.getElementById('btn0').classList.toggle('active-enh', idx === 0);
            document.getElementById('btn1').classList.toggle('active-noisy', idx === 1);
            
            // Sync and Start the selected one
            const active = idx === 0 ? wsEnh : wsNoisy;
            active.setTime(time);
            await active.play();
        }

        document.getElementById('btn0').onclick = () => togglePlayer(0);
        document.getElementById('btn1').onclick = () => togglePlayer(1);

        function bufferToWavBlob(channelData, sampleRate) {
            const buffer = new ArrayBuffer(44 + channelData.length * 2);
            const view = new DataView(buffer);
            const writeString = (o, s) => { for (let i=0; i<s.length; i++) view.setUint8(o+i, s.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + channelData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, channelData.length * 2, true);
            for (let i = 0, offset = 44; i < channelData.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }
        scanFolder();
    </script>
</body>
</html>
