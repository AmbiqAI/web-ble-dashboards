<!DOCTYPE html>
<html>
<head>
  <title>NNSE | USB Audio Studio</title>
  <link href='https://fonts.googleapis.com/css?family=Roboto+Mono:400,700' rel='stylesheet'>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root {
      --bg-color: #0a0a0b;
      --widget-bg: #141417;
      --accent-neon: #d8f41d;
      --accent-red: #FF355E;
      --text-main: #DAE3E3;
      --border-color: #2a2a2e;
    }

    * { box-sizing: border-box; font-family: 'Roboto Mono', monospace; }
    
    body { 
      color: var(--text-main); 
      background: var(--bg-color); 
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 15px;
    }

    /* Header & Status */
    .header-bar {
      grid-column: 1 / -1;
      background: var(--widget-bg);
      border: 1px solid var(--border-color);
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 4px;
    }

    #pairButton {
      background-color: var(--accent-neon);
      border: none;
      color: black;
      font-weight: bold;
      padding: 8px 24px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #pairButton:hover {
      box-shadow: 0 0 15px rgba(216, 244, 29, 0.4);
      transform: translateY(-1px);
    }

    #bluetooth {
      font-size: 14px;
      color: #888;
    }

    /* Widgets */
    .widget {
      background: var(--widget-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 4px;
      position: relative;
    }

    .widget-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 15px;
      display: block;
      border-left: 3px solid var(--accent-neon);
      padding-left: 10px;
    }

    /* Waveform Canvas */
    #waveformCanvas {
      background: #000;
      width: 100%;
      height: 180px;
      border-radius: 2px;
    }

    /* Audio Player */
    .audio-container {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 20px;
      background: #1a1a1e;
      padding: 10px 20px;
      border-radius: 4px;
    }

    audio {
      flex-grow: 1;
      filter: invert(100%) hue-rotate(180deg) brightness(1.5);
      height: 35px;
    }

    /* Buttons */
    button#saveWavBtn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 15px;
      border-radius: 3px;
    }

    button#saveWavBtn:hover {
      border-color: var(--accent-neon);
      color: var(--accent-neon);
    }

    #snackbar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #222;
      border-left: 4px solid var(--accent-neon);
      padding: 10px 20px;
      font-size: 12px;
      z-index: 100;
    }

    /* Latency Chart */
    #SeLatency {
      width: 100%;
      height: 220px;
    }
  </style>
</head>

<body>
    <div class="dashboard">
        <div id="snackbar">System Ready...</div>

        <header class="header-bar">
            <div>
              <span style="font-weight: bold; font-size: 18px; color: var(--accent-neon);">NNSE</span>
              <span style="color: #555; margin-left: 10px;">USB v2.0</span>
            </div>
            <div id="bluetooth">DISCONNECTED</div>
            <button id="pairButton">Connect Device</button>
        </header>

        <div class="widget">
            <span class="widget-title">Audio Spectrum (6s buffer)</span>
            <canvas id="waveformCanvas" width="460" height="180"></canvas>
            <button id="saveWavBtn">EXPORT .WAV</button>
        </div>

        <div class="widget">
            <span class="widget-title">Engine Metrics</span>
            <div id="SeLatency"></div>
        </div>

        <div class="audio-container">
            <span style="font-size: 10px; color: #666;">MONITOR</span>
            <audio controls></audio>
        </div>
    </div>

<script src="serial.js"></script>
<script>
    // --- 1. Global Setup & Worker Init ---
    const audioWorker = new Worker('worker.js');
    const SAMPLE_RATE = 48000;
    const DISPLAY_SECONDS = 6;
    const TOTAL_SAMPLES = SAMPLE_RATE * DISPLAY_SECONDS;
    
    let isPlotting = false; 
    let chunkNum = 0;
    let opusLatency = 0;
    let seEnabledFlag = 0;
    let platform = 0;

    // Ring Buffer & Canvas Setup
    let ringBuffer = new Float32Array(TOTAL_SAMPLES);
    let writePtr = 0;
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const BLEstatus = document.getElementById('bluetooth');
    const pairButton = document.getElementById('pairButton');

    // Audio Decoder & Output
    const audioDecoder = new AudioDecoder({output: decodeToQueue2, error: onAudioError});
    audioDecoder.configure({ codec: "opus", sampleRate: SAMPLE_RATE, numberOfChannels: 1 });

    const generator = new MediaStreamTrackGenerator({ kind: 'audio' });
    const audioWriter = generator.writable.getWriter();
    document.querySelector('audio').srcObject = new MediaStream([generator]);

    let decoderController;
    const decoderStream = new ReadableStream({ start(c) { decoderController = c; } });

    // --- 2. Worker Communication ---
    audioWorker.onmessage = function(e) {
        if (e.data.type === 'WAV_BLOB') {
            const url = URL.createObjectURL(e.data.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nnse_recording_${Date.now()}.wav`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    };

    async function decodeToQueue2(audioData) {
        // --- PHASE 1: DATA EXTRACTION ---
        const ab = new Float32Array(960);
        audioData.copyTo(ab, {planeIndex: 0});
        for (let i = 0; i < ab.length; i++) { ab[i] = ab[i] * 20; }

        // --- PHASE 2: SAVING (Worker) ---
        // Immediate forward to the "Vault" thread
        audioWorker.postMessage({ type: 'RECORD_CHUNK', payload: new Float32Array(ab) });

        // --- PHASE 3: PLAYBACK (Highest Priority) ---
        decoderController.enqueue(audioData.duration);
        
        // We do not 'await' this to prevent blocking the USB loop
        audioWriter.write(audioData).then(() => {
            // OPTIONAL: Monitor Playback Health
            // desiredSize tells us how many more samples the hardware wants.
            // If this number is very high, it means the hardware buffer is nearly empty (Dangerous).
            if (audioWriter.desiredSize > 5000) {
                console.warn("Playback buffer is getting low!");
            }
        }).catch(e => console.error("Hardware starvation!", e));

        // --- PHASE 4: UPDATE 6s RING BUFFER ---
        for (let i = 0; i < ab.length; i++) {
            ringBuffer[(writePtr + i) % TOTAL_SAMPLES] = ab[i];
        }
        writePtr = (writePtr + ab.length) % TOTAL_SAMPLES;

        // --- PHASE 5: DRAWING (Lossy) ---
        if (!isPlotting) {
            isPlotting = true;
            requestAnimationFrame(drawWaveform); 
        }
    }

    function drawWaveform() {
        // 1. Clear Canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 2. Setup Line Style
        ctx.beginPath();
        ctx.strokeStyle = '#FF355E';
        ctx.lineWidth = 1;

        // 3. Calculate "Samples Per Pixel"
        // (288,000 samples / 400 pixels = 720 samples per pixel)
        const samplesPerPixel = Math.floor(TOTAL_SAMPLES / canvas.width); 
        
        for (let x = 0; x < canvas.width; x++) {
            // Find the 720 samples for this specific pixel column
            // We start from the oldest data (writePtr)
            let startIdx = (writePtr + (x * samplesPerPixel)) % TOTAL_SAMPLES;
            
            let min = 1.0;
            let max = -1.0;

            // Find the Min/Max (The Envelope) in this slice
            for (let i = 0; i < samplesPerPixel; i++) {
                let s = ringBuffer[(startIdx + i) % TOTAL_SAMPLES];
                if (s < min) min = s;
                if (s > max) max = s;
            }

            // Map audio values (-1 to 1) to canvas height
            let yMin = (min + 1) * (canvas.height / 2);
            let yMax = (max + 1) * (canvas.height / 2);

            // Draw the vertical line for this pixel
            ctx.moveTo(x, yMin);
            ctx.lineTo(x, yMax);
        }
        
        ctx.stroke();
        isPlotting = false; // Reset the gate for the next frame
    }
    function saveWavFromBuffer() {
        audioWorker.postMessage({ type: 'GENERATE_WAV' });
    }

    // --- 4. USB / Data Handlers ---
    async function old_usbConnect() {
        // Change this in your connect function
        pairButton.style.backgroundColor = 'transparent';
        pairButton.style.border = '1px solid var(--accent-neon)';
        pairButton.style.color = 'var(--accent-neon)';
        pairButton.innerHTML = "SYSTEM LIVE";
        
        serial.requestPort().then(selectedPort => {
            port = selectedPort;
            port.connect().then(() => {
                port.onReceive = data => decodeAndDisplay(data);
                pairButton.style.backgroundColor = 'green';
                pairButton.style.color = 'white';
                pairButton.innerHTML = "CONNECTED";
                msg('Connected');
                initGraph('SeLatency');
            });
        }).catch(error => { msg(error); pairButton.style.backgroundColor = "#d8f41d"; });
    }

    function decodeAndDisplay(data) {
        let type = data.getUint8(0);
        let length = data.getUint8(1);
        platform = data.getUint8(2);

        if (type == 0x1) {
            seEnabledFlag = data.getUint8(3);
            msg(seEnabledFlag == 0 ? 'SE mode: disabled' : 'SE mode: enabled');
        } else if (type == 0x2) {
            handleSeLatencyNotifications(data.getUint32(3, true));
        } else if (type == 0x3) {
            handleOpusLatencyNotifications(data.getUint32(3, true));
        } else if (type == 0x4) {
            let audioData = new DataView(data.buffer, data.byteOffset + 3, length);
            handleNotifications(audioData);
        }
    }

    function handleNotifications(value) {
        const init = { type: "key", data: value, timestamp: chunkNum * 20000, duration: 20000 };
        chunkNum++;
        audioDecoder.decode(new EncodedAudioChunk(init));
    }

    function handleSeLatencyNotifications(value) {
        let latency = seEnabledFlag == 0 ? 0 : value / 1000;
        let myOpusLatency = opusLatency * 50;
        let myLatency = latency * 100;
        let idle = 1000 - myLatency - myOpusLatency;

        Plotly.newPlot('SeLatency', [{
            labels: ['AI Inference', 'Encoder', 'Idle'],
            values: [myLatency, myOpusLatency, idle],
            type: 'pie',
            marker: { colors: ['rgb(0, 204, 0)', 'rgb(255, 255, 0)', 'rgb(0, 0, 195)'] }
        }], { 
            plot_bgcolor: '#111111', paper_bgcolor: '#111111', 
            margin: { l: 8, r: 8, b: 18, t: 18 },
            height: 200, width: 400 
        });
    }

    function handleOpusLatencyNotifications(value) { opusLatency = value / 1000; }
    function onAudioError(e) { console.error(e); }
    function msg(m) { BLEstatus.innerHTML = m; }
    function initGraph(id) { 
        Plotly.newPlot(id, [{ labels: ['Idle'], values: [100], type: 'pie' }], { plot_bgcolor: '#111111', paper_bgcolor: '#111111' }); 
    }

    document.getElementById('saveWavBtn').onclick = saveWavFromBuffer;
    pairButton.onclick = old_usbConnect;
</script>
</body>
</html>
