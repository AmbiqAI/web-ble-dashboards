<!DOCTYPE html>
<html>
<head>
  <title>NNSE | Pro Studio</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root { --bg: #0a0a0b; --w: #141417; --neon: #d8f41d; --red: #FF355E; --text: #DAE3E3; }
    * { box-sizing: border-box; font-family: 'Roboto Mono', monospace; }
    body { color: var(--text); background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .dashboard { width: 1000px; display: grid; grid-template-columns: 1fr 1fr; grid-gap: 15px; }
    .header-bar { grid-column: 1 / -1; background: var(--w); border: 1px solid #2a2a2e; padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; }
    #pairButton { background: var(--neon); border: none; color: #000; font-weight: bold; padding: 8px 24px; border-radius: 4px; cursor: pointer; }
    .widget { background: var(--w); border: 1px solid #2a2a2e; padding: 20px; border-radius: 4px; }
    .widget-title { font-size: 11px; text-transform: uppercase; color: #666; margin-bottom: 15px; border-left: 3px solid var(--neon); padding-left: 10px; }
    #waveformCanvas { background: #000; width: 100%; height: 180px; }
    .perf-metrics { margin-top: 10px; padding: 10px; background: #000; font-size: 10px; color: #555; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .perf-val { color: var(--neon); font-weight: bold; }
    .audio-container { grid-column: 1 / -1; background: #1a1a1e; padding: 10px; border-radius: 4px; }
    audio { width: 100%; filter: invert(100%); }
    .export-btn { width: 100%; background: var(--red); color: #fff; border: none; padding: 12px; cursor: pointer; margin-top: 10px; font-weight: bold; text-transform: uppercase; border-radius: 4px; }
    .export-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
    <div class="dashboard">
        <header class="header-bar">
            <div style="color: var(--neon); font-weight: bold;">NNSE v2.0</div>
            <div id="status">DISCONNECTED</div>
            <button id="pairButton">CONNECT DEVICE</button>
        </header>

        <div class="widget">
            <span class="widget-title">Live Waveform</span>
            <input type="range" id="gainSlider" min="-40" max="20" step="1" value="0" style="width:100%; accent-color:var(--neon);">
            <div style="font-size: 10px; margin: 5px 0;">GAIN: <span id="gainVal">0</span> dB</div>
            
            <canvas id="waveformCanvas" width="460" height="180"></canvas>
            
            <div class="perf-metrics">
                <div>Draw: <span id="drawTime" class="perf-val">0</span>ms</div>
                <div>Plotly: <span id="plotlyTime" class="perf-val">0</span>ms</div>
                <div style="grid-column: 1/-1; border-top: 1px solid #222; padding-top: 5px; display:flex; justify-content:space-between; align-items:center;">
                    <span>PEAK: <span id="peakTime" style="color:var(--red)">0</span>ms</span>
                    <button onclick="maxFrameTime=0; document.getElementById('peakTime').innerText='0'" style="font-size:9px; background:none; border:1px solid #444; color:#888; cursor:pointer; padding:2px 5px;">RESET</button>
                </div>
            </div>
            <button id="saveWavBtn" class="export-btn">Download .WAV Recording</button>
        </div>

        <div class="widget">
            <span class="widget-title">Engine Metrics</span>
            <div id="SeLatency" style="width:100%; height:250px;"></div>
        </div>

        <div class="audio-container"><audio controls id="monitor"></audio></div>
    </div>

    <script src="serial.js"></script>
    <script>
        // Start Worker
        const audioWorker = new Worker('worker.js');
        
        const SAMPLE_RATE = 48000;
        const TOTAL_SAMPLES = SAMPLE_RATE * 6;
        let isPlotting = false, chunkNum = 0, currentGain = 1, maxFrameTime = 0;
        let ringBuffer = new Float32Array(TOTAL_SAMPLES), writePtr = 0;
        let latestPieData = { inference: 0, encoder: 0, seEnabled: 0 };

        // Handle File Download from Worker
        audioWorker.onmessage = (e) => {
            if (e.data.type === 'WAV_BLOB') {
                console.log("Worker sent WAV. Downloading...");
                const url = URL.createObjectURL(e.data.blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `NNSE_Studio_${Date.now()}.wav`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
        };

        // dB to Linear conversion: multiplier = 10^(dB/20)
        document.getElementById('gainSlider').oninput = (e) => { 
            const db = parseFloat(e.target.value);
            currentGain = Math.pow(10, db / 20); 
            document.getElementById('gainVal').innerText = db; 
        };

        const audioDecoder = new AudioDecoder({output: decodeToQueue2, error: console.error});
        audioDecoder.configure({ codec: "opus", sampleRate: SAMPLE_RATE, numberOfChannels: 1 });

        const generator = new MediaStreamTrackGenerator({ kind: 'audio' });
        const audioWriter = generator.writable.getWriter();
        document.getElementById('monitor').srcObject = new MediaStream([generator]);

        let decoderController;
        new ReadableStream({ start(c) { decoderController = c; } });

        async function decodeToQueue2(audioData) {
            const tStart = performance.now();
            const ab = new Float32Array(960);
            audioData.copyTo(ab, {planeIndex: 0});
            
            // Apply the gain multiplier derived from the dB slider
            for (let i = 0; i < ab.length; i++) { ab[i] *= currentGain; }
            
            // Send to recorder thread
            audioWorker.postMessage({ type: 'RECORD_CHUNK', payload: ab });

            decoderController?.enqueue(audioData.duration);
            audioWriter.write(audioData).catch(()=>{});

            for (let i = 0; i < ab.length; i++) { ringBuffer[(writePtr + i) % TOTAL_SAMPLES] = ab[i]; }
            writePtr = (writePtr + ab.length) % TOTAL_SAMPLES;

            if (!isPlotting) {
                isPlotting = true;
                requestAnimationFrame(() => {
                    const dStart = performance.now();
                    drawWaveform();
                    const dEnd = performance.now();
                    document.getElementById('drawTime').innerText = (dEnd - dStart).toFixed(2);
                    const total = dEnd - tStart;
                    if (total > maxFrameTime) { 
                        maxFrameTime = total; 
                        document.getElementById('peakTime').innerText = maxFrameTime.toFixed(2); 
                    }
                    isPlotting = false;
                });
            }
        }

        function drawWaveform() {
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.strokeStyle = '#FF355E';
            const step = Math.floor(TOTAL_SAMPLES / canvas.width);
            for (let x = 0; x < canvas.width; x++) {
                let start = (writePtr + (x * step)) % TOTAL_SAMPLES;
                let min = 1, max = -1;
                for (let i = 0; i < step; i++) {
                    let s = ringBuffer[(start + i) % TOTAL_SAMPLES];
                    if (s < min) min = s; if (s > max) max = s;
                }
                ctx.moveTo(x, (min + 1) * 90); ctx.lineTo(x, (max + 1) * 90);
            }
            ctx.stroke();
        }

        setInterval(() => {
            if (document.getElementById('status').innerText !== "CONNECTED") return;
            const pStart = performance.now();
            let myLat = (latestPieData.seEnabled == 0 ? 0 : latestPieData.inference / 1000) * 100;
            let myOpus = latestPieData.encoder * 50;
            let idle = 1000 - myLat - myOpus;

            Plotly.react('SeLatency', [{
                labels: ['AI', 'Enc', 'Idle'],
                values: [myLat, myOpus, idle],
                type: 'pie',
                marker: { colors: ['#00ff00', '#ffff00', '#0000ff'] }
            }], { 
                plot_bgcolor: '#111', paper_bgcolor: '#111', margin: {l:10,r:10,b:10,t:10}, font: {color:'#888', size:10} 
            }).then(() => {
                document.getElementById('plotlyTime').innerText = (performance.now() - pStart).toFixed(2);
            });
        }, 250);

        function decodeAndDisplay(data) {
            let type = data.getUint8(0);
            if (type == 0x1) latestPieData.seEnabled = data.getUint8(3);
            else if (type == 0x2) latestPieData.inference = data.getUint32(3, true);
            else if (type == 0x3) latestPieData.encoder = data.getUint32(3, true) / 1000;
            else if (type == 0x4) {
                audioDecoder.decode(new EncodedAudioChunk({
                    type: "key", data: new DataView(data.buffer, data.byteOffset + 3, data.getUint8(1)),
                    timestamp: chunkNum * 20000, duration: 20000
                }));
                chunkNum++;
            }
        }

        document.getElementById('pairButton').onclick = async () => {
            serial.requestPort().then(port => {
                port.connect().then(() => {
                    port.onReceive = data => decodeAndDisplay(data);
                    document.getElementById('status').innerText = "CONNECTED";
                    Plotly.newPlot('SeLatency', [{ labels: ['Idle'], values: [100], type: 'pie' }], { plot_bgcolor: '#111', paper_bgcolor: '#111', font: {color:'#888'} });
                });
            });
        };

        // Export Trigger
        document.getElementById('saveWavBtn').onclick = () => {
            console.log("Requesting export...");
            audioWorker.postMessage({ type: 'GENERATE_WAV' });
        };
    </script>
</body>
</html>
